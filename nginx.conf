# nginx.conf — runs alongside FastAPI inside the pod container
# FastAPI on :8080 (control plane), nginx on :8000 (HLS serving)
# But RunPod exposes ONE port per pod — so nginx proxies /hls/* to filesystem
# and proxies everything else to FastAPI

worker_processes 1;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # CORS for Chromecast / extension cross-origin requests
    map $http_origin $cors_allow {
        default "*";
    }

    server {
        listen 8080;
        server_name _;

        # HLS files served directly from disk
        location /hls/ {
            alias /var/hls/;
            add_header Cache-Control "no-cache, must-revalidate";
            add_header Access-Control-Allow-Origin $cors_allow always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t                    ts;
            }
        }

        # Everything else (FastAPI control plane)
        location / {
            proxy_pass http://127.0.0.1:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
