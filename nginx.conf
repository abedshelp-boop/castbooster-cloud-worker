# nginx.conf — runs alongside FastAPI inside the pod container
# FastAPI on :8001 (control plane), nginx on :8080 (HLS + reverse proxy)
# RunPod exposes ONE port per pod — so nginx proxies /hls/* to filesystem
# and proxies everything else to FastAPI on 127.0.0.1:8001.
#
# v0.1.8: Self-contained config — does NOT include /etc/nginx/mime.types,
# because we use the static-binary nginx that has no system mime.types
# file shipped. The two MIME types we actually need (m3u8 and ts) are
# inlined in the /hls/ location block below.

# pid + error_log paths must be writable. /run is writable in the base.
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

worker_processes 1;
events { worker_connections 1024; }

http {
    # Inlined: we only need these two types for HLS. The default_type
    # below applies to anything else.
    default_type  application/octet-stream;

    access_log /var/log/nginx/access.log;

    sendfile on;
    keepalive_timeout 65;

    # CORS for Chromecast / extension cross-origin requests
    map $http_origin $cors_allow {
        default "*";
    }

    # nginx tmp file paths (need to be writable on disk)
    client_body_temp_path /var/lib/nginx/body;
    proxy_temp_path       /var/lib/nginx/proxy;
    fastcgi_temp_path     /var/lib/nginx/fastcgi;
    uwsgi_temp_path       /var/lib/nginx/uwsgi;
    scgi_temp_path        /var/lib/nginx/scgi;

    server {
        listen 8080;
        server_name _;

        # HLS files served directly from disk
        location /hls/ {
            alias /var/hls/;
            add_header Cache-Control "no-cache, must-revalidate";
            add_header Access-Control-Allow-Origin $cors_allow always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t                    ts;
            }
        }

        # Everything else (FastAPI control plane)
        location / {
            proxy_pass http://127.0.0.1:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
